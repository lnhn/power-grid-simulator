services:
  power-grid:
    build: .
    container_name: power-grid-simulator
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/dev.db"
      NEXTAUTH_URL: "http://localhost:3000"
      # 生产环境必须换成随机值：openssl rand -base64 32
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?请设置 NEXTAUTH_SECRET}"
      SEED_PASSWORD: "${SEED_PASSWORD:?请设置 SEED_PASSWORD}"
      SEED_TENANT_ID: "default"
    volumes:
      - ./data:/data